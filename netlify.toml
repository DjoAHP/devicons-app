# netlify.toml
# Configuration pour djodev-icons (TanStack Start + Netlify Functions)

[build]
  command = "npm run build && npm run build:icons"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache pour les assets statiques
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache pour les SVGs (icons CDN)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Rediriger les server functions TanStack Start
[[redirects]]
  from = "/_serverFn/*"
  to = "/_serverFn/:splat"
  status = 200

# Rediriger les routes API
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# Catch-all pour SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
